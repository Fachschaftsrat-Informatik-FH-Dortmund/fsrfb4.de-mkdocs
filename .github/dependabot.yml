# .github/dependabot.yml

version: 2
updates:
  # Python packages pinned in requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "pip"
    groups:
      # One PR per month for all minor and patch bumps; majors stay
      # separate so they can be reviewed on their own.
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "actions"
    groups:
      github-actions:
        patterns:
          - "*"
